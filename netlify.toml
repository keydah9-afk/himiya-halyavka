[build]
  publish = "dist"
  command = "pnpm build"

# У проєкті лежить pnpm-lock.yaml — Netlify сам вмикає pnpm, коли його бачить.
# Node фіксуємо явно, щоб збірка не поїхала за дефолтом платформи.
[build.environment]
  NODE_VERSION = "22"

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Технічний домен Netlify віддає той самий сайт, що й піддомен, — це дублі в пошуку.
[[redirects]]
  from = "https://himiya-halyavka.netlify.app/*"
  to = "https://himiya.halyavka.net/:splat"
  status = 301
  force = true
